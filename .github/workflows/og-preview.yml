name: Build WhatsApp preview image
on:
  push:
    paths:
      - 'scripts/generate_og.py'
      - 'images/Book S&M (89).jpg'
      - '.github/workflows/og-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Render invitation thumbnail
        run: python scripts/generate_og.py
      - name: Commit thumbnail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Generate share preview for WhatsApp"
            git push
          fi
